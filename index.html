<meta name="theme-color" content="#0e0b16">
<style>
:root{--bg:#0e0b16;--card:#191427;--tx:#f3effa;--mu:#9a93b0;--ac:#8b5cf6;--ac2:#fb923c;--bd:#2a2340;--ok:#22c55e}
[data-theme=light]{--bg:#f6f4fb;--card:#fff;--tx:#1b1530;--mu:#6b6384;--bd:#e4def2}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:62px 12px 84px}
.top,nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);z-index:5;display:flex;align-items:center}
.top{top:0;height:52px;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--bd)}
nav{bottom:0;height:62px;border-top:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:22px;padding:8px;cursor:pointer}
nav button.on{color:var(--ac)}
.logo{font:800 26px system-ui;letter-spacing:-1px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:none;border:0;font-size:20px;margin-left:12px;cursor:pointer;color:var(--tx)}
.btn{background:linear-gradient(90deg,var(--ac),#a855f7);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;display:inline-block}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:5px 12px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.hd{display:flex;gap:10px;align-items:center}
.hd small,.mu,small{color:var(--mu);display:block;font-size:12px}
.st{margin-left:auto;font-size:12px;color:var(--ac2);white-space:nowrap}.st.ok{color:var(--ok)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.vb{background:#3b82f6;color:#fff;border-radius:50%;font-size:9px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.tag{display:inline-block;background:rgba(139,92,246,.18);color:var(--ac);border-radius:8px;padding:2px 9px;font-size:12px;margin:8px 0 4px}
.card img{width:100%;border-radius:12px;margin-top:8px}
.ft{display:flex;gap:18px;margin-top:10px;color:var(--mu);align-items:center}.ft span{cursor:pointer}
.ft .on{color:var(--ac2);font-weight:700}
h3,h4{margin:14px 0 8px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.pk{min-width:118px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.streak{background:linear-gradient(90deg,rgba(251,146,60,.2),rgba(139,92,246,.2));border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.streak span{color:var(--mu);font-size:12px}
.best{border-color:var(--ok)}.bt{color:var(--ok);font-weight:700;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:6px 0;font:inherit}
.compose{display:flex;gap:8px;position:sticky;bottom:70px;background:var(--bg);padding:8px 0}.compose input{margin:0}
.back{background:none;border:0;color:var(--ac);font-size:15px;cursor:pointer;padding:6px 0}
.lb{display:flex;align-items:center;gap:12px}.lb b.rk{width:26px;font-size:18px}.lb .pt{margin-left:auto;font-weight:700;color:var(--ac2)}
.lb.mine{border-color:var(--ac)}
.sh{height:calc(100vh - 140px);overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:16px}
.sc{height:100%;scroll-snap-align:start;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;color:#fff;border-radius:16px;margin-bottom:8px}
.sc h2{font-size:28px;line-height:1.15}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;margin:5px 0}
.msg.me{background:var(--ac);color:#fff;margin-left:auto}.msg.th{background:var(--card);border:1px solid var(--bd)}
.dm{display:flex;gap:12px;align-items:center;cursor:pointer}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{font-size:64px;animation:pop 1.1s ease-out both;filter:drop-shadow(0 0 22px rgba(139,92,246,.7))}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#splash .logo{animation:none}}
.logo{background:none;-webkit-text-fill-color:currentColor;color:var(--ac)}
#splash .logo{filter:none}
.btn{background:var(--ac)}.btn.ghost{background:transparent}
.card,.pk{border-radius:12px}
.streak{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac2);border-radius:12px}
.streak b{display:flex;align-items:center;gap:6px}.streak svg{color:var(--ac2)}
.ft span,.ib{display:inline-flex;align-items:center;gap:5px}
.ib{margin-left:8px;padding:6px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav .l{font-size:10px}.nl{display:none}
.dk{display:none!important}
.row,.chips,.sh{scrollbar-width:none}.row::-webkit-scrollbar,.chips::-webkit-scrollbar,.sh::-webkit-scrollbar{display:none}
body{display:block}#shell{display:block}#app{margin:0 auto}#rp{display:none}
@media(min-width:768px){
.top{display:none}
#shell{display:flex;justify-content:center;align-items:flex-start}
nav{position:sticky;top:0;bottom:auto;left:auto;transform:none;width:76px;max-width:none;height:100vh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:18px 10px;border-top:0;border-right:1px solid var(--bd);flex:none}
.dk{display:flex!important}
nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:16px;padding:12px;border-radius:12px}
nav button:hover{background:var(--card)}nav .l{display:none;font-size:15px}
#app{margin:0;max-width:640px;padding:24px 22px;min-width:0;flex:1}
.compose{bottom:0}.sh{height:calc(100vh - 60px)}
}
@media(min-width:1100px){
nav{width:240px}nav .l{display:inline;color:var(--tx)}.nl{display:block;font-size:30px;padding:6px 12px 18px}
#rp{display:block;width:330px;flex:none;position:sticky;top:0;padding:28px 18px}
.pkrow{display:none}
}
@media(min-width:1700px){html{zoom:1.3}}
#splash{flex-direction:column;gap:12px}
#splash img{width:140px;height:140px;border-radius:26%;animation:pop 1.1s ease-out both}
#splash .logo{font-size:34px;animation:none}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}}
.card p{white-space:pre-line}
</style>

{"id": 10, "by": "u5", "kind": "Doubt", "tags": ["Physics"], "subj": "Physics", "cls": 12, "text": "What is a singularity?", "img": "i1", "ts": mins(18), "up": 19, "solved": true, "best": 201, "ans": [{"id": 201, "by": "u4", "text": "A gravitational singularity in a black hole solution is a point or region deep inside a black hole where the mass is crushed into a volume of zero size, resulting in infinite density, infinite spacetime curvature, and a complete breakdown of the laws of physics.", "up": 23, "ts": mins(10)}]}, {"id": 11, "by": "u3", "kind": "Doubt", "tags": ["Physics"], "subj": "Physics", "cls": 9, "text": "What is quantum entanglement?", "img": "i6", "ts": mins(38), "up": 26, "solved": true, "best": 202, "ans": [{"id": 202, "by": "u4", "text": "Quantum entanglement is a physical phenomenon where two or more particles become linked so closely that the quantum state of one cannot be described independently of the others, regardless of how far apart they are. Measuring a property of one particle, such as its spin or polarization, instantaneously determines the corresponding property of its partner.", "up": 31, "ts": mins(25)}]}, {"id": 12, "by": "u1", "kind": "Doubt", "tags": ["Physics"], "subj": "Physics", "cls": 10, "text": "What is the multiverse theory?", "img": "i5", "ts": mins(75), "up": 14, "solved": false, "best": null, "ans": [{"id": 203, "by": "u4", "text": "The multiverse theory is a scientific and philosophical concept suggesting that our universe, with its billions of galaxies, stars, and planets, may not be the only one. Instead, it could be just one of many, or even an infinite number, of parallel universes that together comprise all of reality, space, time, and physical laws.", "up": 12, "ts": mins(60)}]}, {"id": 13, "by": "u3", "kind": "Doubt", "tags": ["Maths"], "subj": "Maths", "cls": 9, "text": "What is a void set?", "img": "i4", "ts": mins(120), "up": 11, "solved": true, "best": 204, "ans": [{"id": 204, "by": "u2", "text": "In mathematics, a void set, also commonly called an empty set or null set, is a unique set that contains no elements.\n\nSymbol: ∅, or curly braces with nothing inside: { }\nCardinality: its size (the number of elements it contains) is 0.\nExample: the set of all real numbers whose square is negative is a void set, because no such real number exists.", "up": 17, "ts": mins(100)}]}, {"id": 14, "by": "u1", "kind": "Doubt", "tags": ["Geography"], "subj": "Geography", "cls": 10, "text": "Who discovered the world map?", "img": "i3", "ts": mins(200), "up": 9, "solved": true, "best": 205, "ans": [{"id": 205, "by": "u2", "text": "There is no single person who \"discovered\" the world map. Instead, mapmaking (cartography) evolved over thousands of years through contributions from various ancient civilizations and scholars.", "up": 10, "ts": mins(180)}]}, {"id": 15, "by": "u5", "kind": "Doubt", "tags": ["Psychology"], "subj": "Psychology", "cls": 12, "text": "How does human nature work?", "img": "i2", "ts": mins(330), "up": 13, "solved": false, "best": null, "ans": [{"id": 206, "by": "u2", "text": "Human nature works as an interplay between evolutionary biology, neuroplasticity, and cultural adaptation. Rather than being a rigid list of fixed instincts, it is an adaptable blueprint shaped by survival needs and social environments.", "up": 9, "ts": mins(300)}]}, {"id": 20, "by": "u1", "kind": "Guidance", "tags": ["Mindset"], "subj": "Mindset", "cls": 10, "text": "Why do we procrastinate on tasks we care about?", "img": "", "ts": mins(32), "up": 33, "solved": true, "best": 300, "ans": [{"id": 300, "by": "u2", "text": "The psychology: Procrastination is rarely a time-management issue. It is an emotional regulation problem where the brain avoids tasks tied to anxiety, fear of failure, or boredom to protect itself from immediate stress.\n\nThe solution: Shrink the starting barrier using the five-minute rule. Commit to working on the task for just five minutes, which lowers emotional resistance and builds momentum.", "up": 19, "ts": mins(22)}]}, {"id": 21, "by": "u5", "kind": "Guidance", "tags": ["Mindset"], "subj": "Mindset", "cls": 12, "text": "Why do people stay in unhealthy habits or relationships?", "img": "", "ts": mins(60), "up": 22, "solved": true, "best": 301, "ans": [{"id": 301, "by": "u4", "text": "The psychology: The human nervous system prioritizes familiarity over happiness. Even if a pattern is painful, the brain views predictable stress as safer than the uncertainty of change.\n\nThe solution: Build safety in small, healthy changes before making major leaps. Replace old routines gradually so your nervous system adapts without triggering panic.", "up": 14, "ts": mins(50)}]}, {"id": 22, "by": "u3", "kind": "Guidance", "tags": ["Mindset"], "subj": "Mindset", "cls": 9, "text": "Why do we overthink minor social interactions?", "img": "", "ts": mins(105), "up": 18, "solved": false, "best": null, "ans": [{"id": 302, "by": "u2", "text": "The psychology: This stems from the Spotlight Effect, a cognitive bias where people overestimate how much others notice their mistakes or appearance. Evolutionary wiring makes the brain treat social rejection like a physical threat.\n\nThe solution: Shift your focus outward by asking others questions about themselves. Remember that most people are too busy worrying about their own impression to scrutinize yours.", "up": 12, "ts": mins(95)}]}, {"id": 23, "by": "u1", "kind": "Guidance", "tags": ["Mindset"], "subj": "Mindset", "cls": 10, "text": "Why do people get defensive when given helpful feedback?", "img": "", "ts": mins(170), "up": 15, "solved": true, "best": 303, "ans": [{"id": 303, "by": "u4", "text": "The psychology: Constructive criticism often triggers cognitive dissonance and ego protection. When feedback clashes with a person's self-image, the brain treats it as a personal attack rather than useful data.\n\nThe solution: Separate your identity from your actions. When receiving feedback, pause for three seconds and ask yourself what single piece of truth you can extract from the comment.", "up": 10, "ts": mins(160)}]}, {"id": 24, "by": "u5", "kind": "Guidance", "tags": ["Mindset"], "subj": "Mindset", "cls": 12, "text": "Why do we judge others harshly while excusing our own mistakes?", "img": "", "ts": mins(260), "up": 12, "solved": false, "best": null, "ans": [{"id": 304, "by": "u2", "text": "The psychology: Psychologists call this the Fundamental Attribution Error. We judge others strictly by their visible actions, while we judge ourselves by our hidden intentions and circumstances.\n\nThe solution: Practice applying the \"charitable assumption.\" Before reacting to someone's mistake, list two external pressures or stresses they might be facing behind the scenes.", "up": 9, "ts": mins(250)}]}, {"id": 25, "by": "u3", "kind": "Guidance", "tags": ["Mindset"], "subj": "Mindset", "cls": 9, "text": "Why do we feel drained even after resting all day?", "img": "", "ts": mins(480), "up": 20, "solved": true, "best": 305, "ans": [{"id": 305, "by": "u4", "text": "The psychology: Physical rest does not cure mental or emotional fatigue. If you spend your rest time scrolling on screens, worrying about tomorrow, or suppressing stress, your brain stays in a state of high alert.\n\nThe solution: Match the type of rest to your type of exhaustion. Take intentional breaks from screens, step outside into nature, or journal your worries to clear mental clutter.", "up": 13, "ts": mins(470)}]},

function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed()}

const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'now':m<60?m+'m':m<1440?Math.floor(m/60)+'h':Math.floor(m/1440)+'d'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av=(id,z=40)=>PH[id]?`<img class="av" src="${PH[id]}" alt="" style="width:${z}px;height:${z}px;object-fit:cover">`:`<span class="av" style="width:${z}px;height:${z}px;background:hsl(${U(id).h} 65% 48%)">${U(id).n[0]}</span>`;
const vb=id=>U(id).r=='mentor'?'<span class="vb" title="Verified mentor">✔</span>':'';

function bump(){const d=new Date().toDateString();if(S.last===d)return;const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=d}

function theme(){S.theme=S.theme=='dark'?'light':'dark';render()}

function vote(id){const d=D(id);d.up+=toggleV('d'+id)?1:-1;render()}
function avote(d,a){const x=D(d).ans.find(z=>z.id==a);x.up+=toggleV('a'+a)?1:-1;render()}

const card=(d,l=1)=>`<div class="card" ${l?`onclick="openD(${d.id})"`:''}><div class="hd">${av(d.by)}<div><b>${U(d.by).n}${vb(d.by)}</b><small>${d.cls?'Class '+d.cls+' · ':''}${ago(d.ts)}</small></div>${QA(d)?`<span class="st ${d.solved?'ok':''}">${d.solved?'✔ Resolved':'● Open'}</span>`:''}</div><span class="tag">${K(d)}</span> <small style="display:inline">${TG(d).map(t=>'#'+t).join(' ')}</small><p>${esc(d.text)}</p>${d.img?`<img src="${IMG[d.img]||d.img}">`:''}<div class="ft"><span class="${S.v['d'+d.id]?'on':''}" onclick="event.stopPropagation();vote(${d.id})">${IC.up} ${d.up}</span><span>${IC.cmt} ${d.ans.length}</span></div></div>`;

function thread(){const d=D(O),mine=d.by==S.me;const ans=[...d.ans].sort((a,b)=>(b.id==d.best)-(a.id==d.best)||b.up-a.up);
