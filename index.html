<meta name="theme-color" content="#0e0b16">
<style>
:root{--bg:#0e0b16;--card:#191427;--tx:#f3effa;--mu:#9a93b0;--ac:#8b5cf6;--ac2:#fb923c;--bd:#2a2340;--ok:#22c55e}
[data-theme=light]{--bg:#f6f4fb;--card:#fff;--tx:#1b1530;--mu:#6b6384;--bd:#e4def2}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding:62px 12px 84px}
.top,nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);z-index:5;display:flex;align-items:center}
.top{top:0;height:52px;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--bd)}
nav{bottom:0;height:62px;border-top:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:22px;padding:8px;cursor:pointer}
nav button.on{color:var(--ac)}
.logo{font:800 26px system-ui;letter-spacing:-1px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{background:none;border:0;font-size:20px;margin-left:12px;cursor:pointer;color:var(--tx)}
.btn{background:linear-gradient(90deg,var(--ac),#a855f7);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px;display:inline-block}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:5px 12px;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.hd{display:flex;gap:10px;align-items:center}
.hd small,.mu,small{color:var(--mu);display:block;font-size:12px}
.st{margin-left:auto;font-size:12px;color:var(--ac2);white-space:nowrap}.st.ok{color:var(--ok)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.vb{background:#3b82f6;color:#fff;border-radius:50%;font-size:9px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.tag{display:inline-block;background:rgba(139,92,246,.18);color:var(--ac);border-radius:8px;padding:2px 9px;font-size:12px;margin:8px 0 4px}
.card img{width:100%;border-radius:12px;margin-top:8px}
.ft{display:flex;gap:18px;margin-top:10px;color:var(--mu);align-items:center}.ft span{cursor:pointer}
.ft .on{color:var(--ac2);font-weight:700}
h3,h4{margin:14px 0 8px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.pk{min-width:118px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.streak{background:linear-gradient(90deg,rgba(251,146,60,.2),rgba(139,92,246,.2));border-radius:16px;padding:12px 14px;display:flex;flex-direction:column}
.streak span{color:var(--mu);font-size:12px}
.best{border-color:var(--ok)}.bt{color:var(--ok);font-weight:700;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:6px 0;font:inherit}
.compose{display:flex;gap:8px;position:sticky;bottom:70px;background:var(--bg);padding:8px 0}.compose input{margin:0}
.back{background:none;border:0;color:var(--ac);font-size:15px;cursor:pointer;padding:6px 0}
.lb{display:flex;align-items:center;gap:12px}.lb b.rk{width:26px;font-size:18px}.lb .pt{margin-left:auto;font-weight:700;color:var(--ac2)}
.lb.mine{border-color:var(--ac)}
.sh{height:calc(100vh - 140px);overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:16px}
.sc{height:100%;scroll-snap-align:start;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;color:#fff;border-radius:16px;margin-bottom:8px}
.sc h2{font-size:28px;line-height:1.15}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;margin:5px 0}
.msg.me{background:var(--ac);color:#fff;margin-left:auto}.msg.th{background:var(--card);border:1px solid var(--bd)}
.dm{display:flex;gap:12px;align-items:center;cursor:pointer}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{font-size:64px;animation:pop 1.1s ease-out both;filter:drop-shadow(0 0 22px rgba(139,92,246,.7))}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#splash .logo{animation:none}}
.logo{background:none;-webkit-text-fill-color:currentColor;color:var(--ac)}
#splash .logo{filter:none}
.btn{background:var(--ac)}.btn.ghost{background:transparent}
.card,.pk{border-radius:12px}
.streak{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac2);border-radius:12px}
.streak b{display:flex;align-items:center;gap:6px}.streak svg{color:var(--ac2)}
.ft span,.ib{display:inline-flex;align-items:center;gap:5px}
.ib{margin-left:8px;padding:6px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav .l{font-size:10px}.nl{display:none}
.dk{display:none!important}
.row,.chips,.sh{scrollbar-width:none}.row::-webkit-scrollbar,.chips::-webkit-scrollbar,.sh::-webkit-scrollbar{display:none}
body{display:block}#shell{display:block}#app{margin:0 auto}#rp{display:none}
@media(min-width:768px){
.top{display:none}
#shell{display:flex;justify-content:center;align-items:flex-start}
nav{position:sticky;top:0;bottom:auto;left:auto;transform:none;width:76px;max-width:none;height:100vh;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:18px 10px;border-top:0;border-right:1px solid var(--bd);flex:none}
.dk{display:flex!important}
nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:16px;padding:12px;border-radius:12px}
nav button:hover{background:var(--card)}nav .l{display:none;font-size:15px}
#app{margin:0;max-width:640px;padding:24px 22px;min-width:0;flex:1}
.compose{bottom:0}.sh{height:calc(100vh - 60px)}
}
@media(min-width:1100px){
nav{width:240px}nav .l{display:inline;color:var(--tx)}.nl{display:block;font-size:30px;padding:6px 12px 18px}
#rp{display:block;width:330px;flex:none;position:sticky;top:0;padding:28px 18px}
.pkrow{display:none}
}
@media(min-width:1700px){html{zoom:1.3}}
#splash{flex-direction:column;gap:12px}
#splash img{width:140px;height:140px;border-radius:26%;animation:pop 1.1s ease-out both}
#splash .logo{font-size:34px;animation:none}
@media(prefers-reduced-motion:reduce){#splash img{animation:none}}
</style>

function vote(id){const d=D(id);d.up+=toggleV('d'+id)?1:-1;render()}
function avote(d,a){const x=D(d).ans.find(z=>z.id==a);x.up+=toggleV('a'+a)?1:-1;render()}
function fol(i){S.fol[i]=!S.fol[i];render()}
function openD(id){O=id;render();scrollTo(0,0)}
const card=(d,l=1)=>`<div class="card" ${l?`onclick="openD(${d.id})"`:''}><div class="hd">${av(d.by)}<div><b>${U(d.by).n}${vb(d.by)}</b><small>${d.cls?'Class '+d.cls+' · ':''}${ago(d.ts)}</small></div>${QA(d)?`<span class="st ${d.solved?'ok':''}">${d.solved?'✔ Resolved':'● Open'}</span>`:''}</div><span class="tag">${K(d)}</span> <small style="display:inline">${TG(d).map(t=>'#'+t).join(' ')}</small><p>${esc(d.text)}</p>${d.img?`<img src="${d.img}">`:''}<div class="ft"><span class="${S.v['d'+d.id]?'on':''}" onclick="event.stopPropagation();vote(${d.id})">${IC.up} ${d.up}</span><span>${IC.cmt} ${d.ans.length}</span></div></div>`;
function home(){const sug=Object.keys(S.users).filter(i=>i!=S.me);
return `<div class="streak"><b>${IC.flame} ${S.streak}-day streak</b><span>Ask or answer a doubt today to keep it alive</span></div>
<h4 class="pkrow">People you may know</h4><div class="row pkrow">${sug.map(i=>`<div class="pk">${av(i,52)}<b>${U(i).n}${vb(i)}</b><small>${sub(i)}</small><button class="btn sm ${S.fol[i]?'ghost':''}" onclick="fol('${i}')">${S.fol[i]?'Following':'Follow'}</button></div>`).join('')}</div>
<div class="chips">${['All',...Object.keys(KINDS)].map(s=>`<button class="chip ${F==s?'on':''}" onclick="F='${s}';render()">${s}</button>`).join('')}</div>
${S.doubts.filter(d=>F=='All'||K(d)==F).map(d=>card(d)).join('')||'<p class="mu">Nothing here yet. Be the first to post.</p>'}`}
function thread(){const d=D(O),mine=d.by==S.me;const ans=[...d.ans].sort((a,b)=>(b.id==d.best)-(a.id==d.best)||b.up-a.up);
return `<button class="back" onclick="O=null;render()">← Back to feed</button>${card(d,0)}<h4>${ans.length} replies</h4>
${ans.map(a=>`<div class="card ${a.id==d.best?'best':''}">${a.id==d.best?'<div class="bt">✔ Best Answer</div>':''}<div class="hd">${av(a.by,32)}<div><b>${U(a.by).n}${vb(a.by)}</b><small>${ago(a.ts)}</small></div></div><p>${esc(a.text)}</p><div class="ft"><span class="${S.v['a'+a.id]?'on':''}" onclick="avote(${d.id},${a.id})">${IC.up} ${a.up}</span>${mine&&!d.solved&&QA(d)?`<button class="btn sm" onclick="best(${d.id},${a.id})">Mark as Best Answer</button>`:''}</div></div>`).join('')||'<p class="mu">No replies yet. Be the first.</p>'}
<div class="compose"><input id="ai" placeholder="Write a reply"><button class="btn" onclick="reply(${d.id})">Send</button></div>`}
function reply(id){const t=$('#ai').value.trim();if(!t)return;const d=D(id);d.ans.push({id:Date.now(),by:S.me,text:t,up:0,ts:Date.now()});U(S.me).pts+=10;bump();render()}
function best(d,a){const x=D(d);x.best=a;x.solved=true;U(x.ans.find(z=>z.id==a).by).pts+=25;render()}
function post(){const u=U(S.me);return `<h3>Create</h3><div class="card"><div class="hd">${av(S.me,40)}<div><b>${u.n}</b><small>${sub(S.me)}</small></div></div>
<div class="chips">${Object.keys(KINDS).map(k=>`<button class="chip ${PK==k?'on':''}" onclick="PK='${k}';keep()">${k}</button>`).join('')}</div>
<textarea id="pt" rows="5" placeholder="${KINDS[PK]}">${esc(PTXT)}</textarea>
<div id="pv">${PIMG?`<img src="${PIMG}" style="width:100%;border-radius:12px">`:''}</div>
<small>Add tags (optional)</small><div class="chips" style="flex-wrap:wrap">${TAGS.map(t=>`<button class="chip ${PT.includes(t)?'on':''}" onclick="tg('${t}')">#${t}</button>`).join('')}</div>
<div class="hd"><label class="btn ghost">Add photo<input type="file" accept="image/*" hidden onchange="pimg(this)"></label><button class="btn" style="margin-left:auto" onclick="sub_()">Post</button></div></div>`}
function keep(){const e=$('#pt');if(e)PTXT=e.value;render()}
function tg(t){PT=PT.includes(t)?PT.filter(x=>x!=t):[...PT,t];keep()}
function pimg(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,600/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);PIMG=c.toDataURL('image/jpeg',.7);$('#pv').innerHTML=`<img src="${PIMG}" style="width:100%;border-radius:12px;margin-top:8px">`};i.src=r.result};r.readAsDataURL(f)}
function sub_(){const e=$('#pt'),t=e.value.trim();if(!t){e.focus();return}S.doubts.unshift({id:Date.now(),by:S.me,kind:PK,tags:[...PT],subj:PT[0]||PK,cls:U(S.me).cls||'',text:t,img:PIMG,ts:Date.now(),up:0,solved:false,best:null,ans:[]});PIMG='';PTXT='';PT=[];PK='Doubt';bump();go('home')}
function search(){return `<input id="q" placeholder="Search doubts, subjects, people" oninput="dos()" value="${esc(Q)}"><div id="sr"></div>`}
function dos(){Q=$('#q').value.toLowerCase().trim();const p=Object.keys(S.users).filter(i=>Q&&U(i).n.toLowerCase().includes(Q)),d=S.doubts.filter(x=>!Q||x.text.toLowerCase().includes(Q)||x.subj.toLowerCase().includes(Q));
$('#sr').innerHTML=p.map(i=>`<div class="card hd">${av(i)}<div><b>${U(i).n}${vb(i)}</b><small>${sub(i)}</small></div></div>`).join('')+d.map(x=>card(x)).join('')||'<p class="mu">Nothing found. Try another word.</p>'}
function leaders(){const l=Object.keys(S.users).sort((a,b)=>U(b).pts-U(a).pts);
return `<h3>Top Solvers this week</h3><p class="mu">+10 points per answer, +25 when it becomes Best Answer</p>${l.map((i,k)=>`<div class="card lb ${i==S.me?'mine':''}"><b class="rk">${k+1}</b>${av(i,36)}<div><b>${U(i).n}${vb(i)}</b><small>${sub(i)}</small></div><span class="pt">${U(i).pts} pts</span></div>`).join('')}`}
const SH=[{t:'Newton’s 3 laws in 30 seconds',b:'Every action has an equal and opposite reaction. That is why a rocket pushes gas down to go up.',by:'u4',c:'#8b5cf6,#ec4899'},{t:'Factorise fast: the sum-product trick',b:'Find two numbers that multiply to c and add to b. Then split the middle term.',by:'u2',c:'#f97316,#ef4444'},{t:'Affect vs effect',b:'A for Action (verb), E for End result (noun). Done.',by:'u2',c:'#0ea5e9,#8b5cf6'},{t:'List vs tuple in Python',b:'Lists change, tuples do not. Pick tuples for fixed data.',by:'u2',c:'#10b981,#0ea5e9'}];
function shorts(){return `<div class="sh">${SH.map((s,i)=>`<div class="sc" style="background:linear-gradient(160deg,${s.c})"><h2>${s.t}</h2><p>${s.b}</p><div class="hd">${av(s.by,32)}<b>${U(s.by).n}${vb(s.by)}</b><span class="st" style="color:#fff;cursor:pointer" onclick="this.textContent=this.textContent=='Like'?'Liked':'Like'">Like</span></div></div>`).join('')}</div>`}
function profile(){const u=U(S.me),me=S.me,na=S.doubts.filter(d=>d.by==me).length,nb=S.doubts.reduce((n,d)=>n+d.ans.filter(a=>a.by==me).length,0);
return `<div class="card" style="text-align:center">${av(me,80)}<h3>${u.n}${vb(me)}</h3><p class="mu">${sub(me)}</p><div class="row" style="justify-content:center;margin-top:12px"><div><b>${u.pts}</b><small>points</small></div><div style="width:18px"></div><div><b>${S.streak}</b><small>day streak</small></div><div style="width:18px"></div><div><b>${na}</b><small>asked</small></div><div style="width:18px"></div><div><b>${nb}</b><small>answered</small></div></div></div>
<button class="btn" style="width:100%;margin:6px 0" onclick="S.me=S.me=='u1'?'u2':'u1';render()">Switch to ${u.r=='student'?'Mentor (Riya)':'Student (Aarav)'}</button>
<button class="btn ghost" style="width:100%;margin:6px 0" onclick="theme()">Switch to ${S.theme=='dark'?'light':'dark'} mode</button>
<button class="btn ghost" style="width:100%;margin:6px 0" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);location.reload()}">Reset demo data</button>`}
function dms(){const k=Object.keys(S.dm).filter(i=>i!=S.me);return `<h3>Messages</h3>${k.map(i=>{const l=S.dm[i];return `<div class="card dm" onclick="C='${i}';render()">${av(i,44)}<div><b>${U(i).n}${vb(i)}</b><small>${esc(l[l.length-1].t)}</small></div></div>`}).join('')}`}
const AUTO=['Sure! Send me the question and I will walk you through it.','Good thinking. Try that and tell me what you get.','Happy to help. Which step is confusing?','Nice, that is the right direction'];
function chat(){const l=S.dm[C]||[];return `<button class="back" onclick="C=null;render()">← Messages</button><div class="card hd">${av(C)}<div><b>${U(C).n}${vb(C)}</b><small>${sub(C)}</small></div></div>${l.map(m=>`<div class="msg ${m.m?'me':'th'}">${esc(m.t)}</div>`).join('')}<div class="compose"><input id="ci" placeholder="Message" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div>`}
function send(){const t=$('#ci').value.trim();if(!t)return;const id=C;(S.dm[id]=S.dm[id]||[]).push({m:1,t});render();setTimeout(()=>{S.dm[id].push({m:0,t:AUTO[Math.floor(Math.random()*AUTO.length)]});render()},900)}
function render(){document.documentElement.dataset.theme=S.theme;
$('#app').innerHTML=O?thread():C?chat():({home,search,post,shorts,me:profile,leaders,dms}[T])();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T&&!O&&!C));
if(T=='search'&&!O&&!C)dos();if(C)scrollTo(0,document.body.scrollHeight);$('#rp').innerHTML=side();save()}
const I=(p,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const MS='<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-5.5A8 8 0 1 1 21 12z"/>';
const IC={home:I('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),search:I('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),post:I('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>'),shorts:I('<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5l5 3.5-5 3.5z"/>'),me:I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),dms:I(MS),leaders:I('<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 21h8M10 17h4"/>'),theme:I('<circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/>'),flame:I('<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',18),up:I('<path d="M6 15l6-6 6 6"/>',16),cmt:I(MS,16)};
const NAV=[['home','Home'],['search','Search'],['post','Create'],['shorts','Shorts'],['dms','Messages',1],['leaders','Leaderboard',1],['me','Profile'],['theme','Theme',1]];
$('#nv').innerHTML='<div class="logo nl">Kaxy</div>'+NAV.map(n=>`<button data-t="${n[0]}" class="${n[2]?'dk':''}" onclick="${n[0]=='theme'?'theme()':"go('"+n[0]+"')"}">${IC[n[0]]}<span class="l">${n[1]}</span></button>`).join('');
$('#tb').innerHTML=`<button class="ib" onclick="go('leaders')">${IC.leaders}</button><button class="ib" onclick="go('dms')">${IC.dms}</button><button class="ib" onclick="theme()">${IC.theme}</button>`;
function side(){const u=U(S.me),l=Object.keys(S.users).sort((a,b)=>U(b).pts-U(a).pts).slice(0,3),sg=Object.keys(S.users).filter(i=>i!=S.me).slice(0,3);
return `<div class="hd">${av(S.me,48)}<div><b>${u.n}${vb(S.me)}</b><small>${sub(S.me)}</small></div><span class="st" style="cursor:pointer;color:var(--ac)" onclick="S.me=S.me=='u1'?'u2':'u1';render()">Switch role</span></div><h4>Suggested for you</h4>${sg.map(i=>`<div class="hd" style="margin:10px 0">${av(i,36)}<div><b>${U(i).n}${vb(i)}</b><small>${sub(i)}</small></div><span class="st" style="cursor:pointer;color:var(--ac)" onclick="fol('${i}')">${S.fol[i]?'Following':'Follow'}</span></div>`).join('')}<h4>Top solvers</h4>${l.map((i,k)=>`<div class="hd" style="margin:10px 0"><b style="width:18px">${k+1}</b>${av(i,30)}<b>${U(i).n}</b><span class="st" style="color:var(--ac2)">${U(i).pts} pts</span></div>`).join('')}`}
const KINDS={Doubt:'What are you stuck on?',Win:'Got a good result? Share it with everyone.',Partner:'Looking for someone to study with?',Guidance:'Ask seniors about exams, college or career.',Tip:'Share a trick that helped you.',Support:'Feeling stressed or low? Talk to your peers. This is support, not therapy.'};
const TAGS=['Maths','Physics','Chemistry','Biology','English','CS','JEE','NEET','Boards','Career','Exam stress','Fun'];
let PK='Doubt',PT=[],PTXT='';
const K=d=>d.kind||'Doubt',TG=d=>d.tags||[d.subj],QA=d=>['Doubt','Guidance'].includes(K(d));
load();render();setTimeout(()=>$('#splash').classList.add('hide'),1900);
</script>
</body>
</html>
